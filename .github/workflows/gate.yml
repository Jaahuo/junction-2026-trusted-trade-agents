name: gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - name: Run gate in an isolated process namespace
        run: |
          sudo --preserve-env=PATH,HOME,DATABASE_URL,TEST_DATABASE_URL,MISE_LOG_LEVEL,MISE_TRUSTED_CONFIG_PATHS,MISE_YES \
            /usr/bin/unshare --mount --propagation private --pid --fork \
            /bin/sh -eu -c '
              /usr/bin/umount --recursive /proc
              /usr/bin/mount --types proc proc /proc
              exec /usr/bin/setpriv --reuid="$1" --regid="$2" --init-groups bun run gate
            ' sh "$(id -u)" "$(id -g)"
