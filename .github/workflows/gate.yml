name: gate
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    name: gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, junction-ci]
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - run: bun install --frozen-lockfile
      - run: gitleaks git --redact --no-banner
      - run: bun check
      - run: bunx vp check
      - run: bunx knip
      - run: bunx jscpd
      - run: |
          bun scripts/db-generate.ts
          if [ -n "$(git status --porcelain --untracked-files=all -- 'contexts/*/migrations')" ]; then
            echo "Schema changed without a migration"
            exit 1
          fi
      - name: Run tests in an isolated process namespace
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: |
          sudo --preserve-env=PATH,HOME,DATABASE_URL,TEST_DATABASE_URL,MISE_LOG_LEVEL,MISE_TRUSTED_CONFIG_PATHS,MISE_YES \
            /usr/bin/unshare --mount --propagation private --pid --fork \
            /bin/sh -eu -c '
              /usr/bin/umount --recursive /proc
              /usr/bin/mount --types proc proc /proc
              exec /usr/bin/setpriv --reuid="$1" --regid="$2" --init-groups bun test
            ' sh "$(id -u)" "$(id -g)"
