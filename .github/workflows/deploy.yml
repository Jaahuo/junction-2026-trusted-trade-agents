name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  api:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, junction-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.verify.outputs.image }}
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          tags: ghcr.io/jaahuo/junction-2026-trusted-trade-agents:${{ env.TAG }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,scope=production-image,mode=max
      - name: Verify published image
        id: verify
        env:
          REGISTRY_USER: ${{ github.actor }}
          CONFIG_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)['containerimage.config.digest'] }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deployment-evidence"
          bash scripts/ci-verify-published-image.sh "$TAG" "$CONFIG_DIGEST" image
          jq -n --arg sha "$SHA" --arg image "$CONFIG_DIGEST" --arg lock "$(sha256sum bun.lock | cut -d ' ' -f 1)" \
            --arg build "$GITHUB_RUN_ID" --arg buildAttempt "$GITHUB_RUN_ATTEMPT" \
            '{schemaVersion: 3, sourceSha: $sha, buildRunId: $build, buildRunAttempt: $buildAttempt, imageId: $image, lockfileSha256: $lock, securityScans: "paused"}' > "$RUNNER_TEMP/deployment-evidence/manifest.json"
      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-evidence
          retention-days: 90
          if-no-files-found: error

  chat:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, junction-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      chat_image: ${{ steps.verify.outputs.chat_image }}
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-chat
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: hosts/openwebui/Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/jaahuo/junction-2026-trusted-trade-agents:${{ env.TAG }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=production-chat-image
          cache-to: type=gha,scope=production-chat-image,mode=max
      - name: Verify published image
        id: verify
        env:
          REGISTRY_USER: ${{ github.actor }}
          CONFIG_DIGEST: ${{ fromJSON(steps.build.outputs.metadata)['containerimage.config.digest'] }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deployment-evidence"
          bash scripts/ci-verify-published-image.sh "$TAG" "$CONFIG_DIGEST" chat_image
          jq -n --arg sha "$SHA" --arg image "$CONFIG_DIGEST" --arg lock "$(sha256sum bun.lock | cut -d ' ' -f 1)" \
            --arg build "$GITHUB_RUN_ID" --arg buildAttempt "$GITHUB_RUN_ATTEMPT" \
            '{schemaVersion: 3, sourceSha: $sha, buildRunId: $build, buildRunAttempt: $buildAttempt, chatImageId: $image, lockfileSha256: $lock, securityScans: "paused"}' > "$RUNNER_TEMP/deployment-evidence/manifest.json"
      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-chat-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-evidence
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: [api, chat]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, linux, x64, junction-ci]
    timeout-minutes: 15
    environment: production
    outputs:
      status: ${{ steps.deploy.outputs.status }}
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - run: bun install --frozen-lockfile
      - name: Skip when a later main pipeline reached its deploy
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bun scripts/ci-deploy-stale.ts
      - name: Deploy verified digest
        id: deploy
        if: steps.fresh.outputs.deploy == 'true'
        env:
          DEPLOY_OUTPUTS: ${{ secrets.DEPLOY_OUTPUTS }}
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          VERDA_INFERENCE_KEY: ${{ secrets.VERDA_INFERENCE_KEY }}
          OPENWEBUI_SECRET_KEY: ${{ secrets.OPENWEBUI_SECRET_KEY }}
          OPENWEBUI_ADMIN_EMAIL: ${{ secrets.OPENWEBUI_ADMIN_EMAIL }}
          OPENWEBUI_ADMIN_PASSWORD: ${{ secrets.OPENWEBUI_ADMIN_PASSWORD }}
          VALIO_AIMO_RECIPE_PERMISSION: ${{ vars.VALIO_AIMO_RECIPE_PERMISSION || 'False' }}
          DEPLOY_IMAGE: ${{ needs.api.outputs.image }}
          DEPLOY_CHAT_IMAGE: ${{ needs.chat.outputs.chat_image }}
          DEPLOY_REGISTRY_USER: ${{ github.actor }}
          DEPLOY_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_OUTPUTS" ] && [ -n "$DEPLOY_ENV" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "Deployment secrets and known hosts are required" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          bun scripts/deploy.ts push
          echo 'status=healthy' >> "$GITHUB_OUTPUT"
      - name: Remove the deployment key from the runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Record deployment result
        if: always()
        env:
          IMAGE: ${{ needs.api.outputs.image }}
          CHAT_IMAGE: ${{ needs.chat.outputs.chat_image }}
          OUTCOME: ${{ steps.deploy.outcome }}
          STATUS: ${{ steps.deploy.outputs.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-result"
          printf 'sourceSha=%s\nrunId=%s\nrunAttempt=%s\nimage=%s\nchatImage=%s\nstepOutcome=%s\nstatus=%s\n' \
            "$SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$IMAGE" "$CHAT_IMAGE" "$OUTCOME" "${STATUS:-not-deployed}" > "$RUNNER_TEMP/deploy-result/result.txt"
      - name: Retain deployment result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-result
          retention-days: 90
          if-no-files-found: error

  smoke-api:
    needs: [api, deploy]
    if: vars.DEPLOY_SMOKE == 'true' && needs.deploy.outputs.status == 'healthy'
    runs-on: [self-hosted, linux, x64, junction-ci]
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: image_smoke
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U postgres -d image_smoke"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.api.outputs.image }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - run: bun install --frozen-lockfile
      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Smoke production runtime
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/fictional-catalogue"
          bun -e 'import { writeFictionalSources } from "./contexts/catalog/src/infra/test-fixtures.ts"; const dir = process.argv[1]; if (!dir) throw new Error("Missing fixture directory"); await writeFictionalSources(dir);' "$fixture"
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/image_smoke bun scripts/catalog-import.ts --source "$fixture"
          umask 077
          bun scripts/generate-keys.ts > "$RUNNER_TEMP/image.env"
          printf '%s\n' \
            'DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/image_smoke' \
            'PORT=3000' 'WHOLESALER_LIVE=mock' \
            'VALIO_AIMO_API_KEY=fictional-smoke-key' \
            'VALIO_AIMO_BASE_URL=http://127.0.0.1:3001' >> "$RUNNER_TEMP/image.env"
          bun scripts/catalogue-smoke-availability.ts 3001 > "$RUNNER_TEMP/availability.log" 2>&1 &
          availability_pid=$!
          trap 'docker logs gate-smoke; docker rm -f gate-smoke; kill "$availability_pid"; rm -f "$RUNNER_TEMP/image.env"' EXIT
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:3001/health
          docker run --detach --name gate-smoke --network host --env-file "$RUNNER_TEMP/image.env" "$IMAGE"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:3000/api/health
          docker exec gate-smoke /usr/local/bin/bun apps/api/src/remote-reset.ts --yes
          test "$(docker inspect --format '{{json .Mounts}}' gate-smoke)" = '[]'
          curl --fail --silent --show-error -H 'content-type: application/json' \
            -d '{"terms":["fictional oats"],"hard":[],"soft":[],"quantity":{"value":1,"unit":"ST"},"deliverBy":"2026-11-20","paymentTerms":"invoice"}' \
            http://127.0.0.1:3000/api/catalog/search | jq -e '.availability.checked == true and (.candidates | any(.productId == "fictional-oats" and .orderQuantity.value == 1))'
          curl --fail --silent --show-error -H 'content-type: application/json' \
            -d '{"productIds":["fictional-oats"],"hard":[]}' \
            http://127.0.0.1:3000/api/catalog/facts | jq -e '.products | any(.productId == "fictional-oats" and .deliveryReliability == 0.95 and .co2PerKg == 1.25)'
          docker exec gate-smoke /usr/local/bin/bun -e '
            if (process.getuid() !== 1000) throw new Error("Expected runtime UID 1000");
            if (await Bun.file("/app/data/valio_aimo_junction26_product_data.json").exists()) throw new Error("Unexpected source data");
            for (const path of ["/bin/sh", "/bin/bash", "/sbin/apk", "/usr/bin/apt", "/usr/bin/apt-get"]) {
              if (await Bun.file(path).exists()) throw new Error(`Unexpected runtime tool: ${path}`);
            }
          '

  smoke-chat:
    needs: [chat, deploy]
    if: vars.DEPLOY_SMOKE == 'true' && needs.deploy.outputs.status == 'healthy'
    runs-on: [self-hosted, linux, x64, junction-ci]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.chat.outputs.chat_image }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Smoke chat runtime
        run: |
          set -euo pipefail
          trap 'docker logs gate-chat-smoke; docker rm -f gate-chat-smoke' EXIT
          docker run --detach --name gate-chat-smoke -p 127.0.0.1:38090:8080 \
            -e WEBUI_AUTH=False -e WEBUI_SECRET_KEY=smoke-only-secret \
            -e ENABLE_OLLAMA_API=False -e ENABLE_OPENAI_API=False \
            -e OFFLINE_MODE=True -e DO_NOT_TRACK=True -e SCARF_NO_ANALYTICS=True \
            -e VALIO_AIMO_RECIPE_PERMISSION=False "$IMAGE"
          curl --fail --silent --show-error --retry 120 --retry-all-errors --retry-delay 2 --max-time 2 http://127.0.0.1:38090/health
          docker exec gate-chat-smoke python -c '
          import json, sys
          from pathlib import Path
          root = Path("/opt/trusted-trade/hosts/openwebui")
          sys.path.insert(0, str(root / "scripts"))
          import provision_agent, provision_buyer, provision_mcp
          assert provision_agent.FILES == root
          assert provision_agent.BASE == "http://127.0.0.1:8080"
          for persona in ("restaurant", "bakery"):
              assert provision_agent.system_prompt(persona)
          json.loads((root / "agent/purchase-scenarios.json").read_text())
          for path in (
              root / "agent/restaurant.png", root / "agent/bakery.png", root / "agent/chef.png",
              root / "scripts/migrate_auth.py", root / "scripts/tools/recipe_planner.py",
              root / "scripts/tools/valio_recipes.py",
              Path("/app/backend/open_webui/static/custom.css"),
              Path("/app/backend/open_webui/static/acme/kitchen.jpg"),
              Path("/app/backend/open_webui/static/acme/bakery.webp"),
              Path("/app/backend/open_webui/static/acme/credits.html"),
          ):
              assert path.is_file() and path.stat().st_size, path
          '
