name: deploy
on:
  workflow_run:
    workflows: [gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    name: deploy
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    # Job-level, so a run that the condition above skips, such as a failed gate, never takes the pending slot.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # Every run deploys the current main head once its push gate passed, whatever commit triggered it.
      # A late gate, a rerun or a manual run never rolls back, and a pending run that the concurrency
      # group replaces loses nothing: the run that executes deploys the latest gated head.
      - name: Choose the gated main head
        id: target
        env:
          CONFIGURED: ${{ secrets.DEPLOY_OUTPUTS != '' && secrets.DEPLOY_ENV != '' && secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          gated=$(gh api "repos/$REPO/actions/workflows/gate.yml/runs?head_sha=$sha&event=push&status=success&per_page=1" --jq .total_count)
          if [ "$CONFIGURED" != "true" ]; then
            reason="deploy secrets are not set; see docs/deploy.md"
          elif [ "$gated" = "0" ]; then
            reason="$sha has no successful push gate run"
          fi
          if [ -n "${reason:-}" ]; then
            echo "Skipped: $reason." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying $sha." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.target.outputs.ready == 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
      - uses: jdx/mise-action@v5
        if: steps.target.outputs.ready == 'true'
      - if: steps.target.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - name: Push to the hosted demo
        if: steps.target.outputs.ready == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_OUTPUTS: ${{ secrets.DEPLOY_OUTPUTS }}
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ "$(gh api "repos/$REPO/commits/main" --jq .sha)" != "$SHA" ]; then
            echo "Skipped: main moved past $SHA; the newer run deploys." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          bun scripts/deploy.ts push
