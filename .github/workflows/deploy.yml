name: deploy
on:
  workflow_run:
    workflows: [gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  target:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      sha: ${{ steps.select.outputs.sha }}
      run_id: ${{ steps.select.outputs.run_id }}
      attempt: ${{ steps.select.outputs.attempt }}
    steps:
      - name: Select latest successful gate for current main
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          run=$(gh api --paginate "repos/$REPO/actions/workflows/gate.yml/runs?head_sha=$sha&event=push&status=success&per_page=100" \
            | jq -sc --arg sha "$sha" --arg repo "$REPO" '[.[].workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success" and .path == ".github/workflows/gate.yml" and .repository.full_name == $repo and .head_repository.full_name == $repo)] | sort_by(.created_at, .id) | last // empty')
          if [ -z "$run" ]; then
            # Main moved past the gate that triggered this run; that commit's own gate deploys it.
            echo "Skipped: $sha has no successful push gate run yet." >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id=$(jq -er '.id | tostring | select(test("^[1-9][0-9]*$"))' <<< "$run")
          attempt=$(jq -er '.run_attempt | tostring | select(test("^[1-9][0-9]*$"))' <<< "$run")
          printf 'ready=true\nsha=%s\nrun_id=%s\nattempt=%s\n' "$sha" "$id" "$attempt" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha from gate run $id attempt $attempt." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: target
    if: needs.target.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: image_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d image_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      chat_image: ${{ steps.publish.outputs.chat_image }}
    env:
      SHA: ${{ needs.target.outputs.sha }}
      RUN_ID: ${{ needs.target.outputs.run_id }}
      ATTEMPT: ${{ needs.target.outputs.attempt }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - name: Start deployment evidence
        run: |
          mkdir -p "$RUNNER_TEMP/deployment-evidence"
          printf 'sourceSha=%s\ngateRunId=%s\ngateRunAttempt=%s\n' "$SHA" "$RUN_ID" "$ATTEMPT" > "$RUNNER_TEMP/deployment-evidence/identity.txt"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build deployment image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          tags: gate-image:${{ env.SHA }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          provenance: false
          sbom: false
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,scope=production-image,mode=max
      - name: Release API build cache before building chat
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          docker buildx prune --all --force
          df -h "$RUNNER_TEMP"
      - name: Build chat image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: hosts/openwebui/Dockerfile
          platforms: linux/amd64
          tags: gate-chat-image:${{ env.SHA }}
          outputs: type=docker,dest=${{ runner.temp }}/chat-image.tar
          provenance: false
          sbom: false
          cache-from: type=gha,scope=production-chat-image
          cache-to: type=gha,scope=production-chat-image,mode=max
      - name: Record built image identity
        run: |
          set -euo pipefail
          image_id=$(bun scripts/ci-image.ts config-digest "$RUNNER_TEMP/image.tar")
          chat_image_id=$(bun scripts/ci-image.ts config-digest "$RUNNER_TEMP/chat-image.tar")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ && "$chat_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          lock_hash=$(sha256sum bun.lock | cut -d ' ' -f 1)
          jq -n --arg sha "$SHA" --arg run "$RUN_ID" --arg attempt "$ATTEMPT" --arg image "$image_id" --arg chatImage "$chat_image_id" --arg lock "$lock_hash" \
            --arg build "$GITHUB_RUN_ID" --arg buildAttempt "$GITHUB_RUN_ATTEMPT" \
            '{schemaVersion: 2, sourceSha: $sha, gateRunId: $run, gateRunAttempt: $attempt, buildRunId: $build, buildRunAttempt: $buildAttempt, imageId: $image, chatImageId: $chatImage, lockfileSha256: $lock, securityScans: "paused"}' > "$RUNNER_TEMP/deployment-evidence/manifest.json"
      - name: Release build cache before loading images
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          docker buildx prune --all --force
          df -h "$RUNNER_TEMP"
      - name: Load verified images and remove archives
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/image.tar"
          rm "$RUNNER_TEMP/image.tar"
          docker load --input "$RUNNER_TEMP/chat-image.tar"
          rm "$RUNNER_TEMP/chat-image.tar"
          df -h "$RUNNER_TEMP"
      - name: Smoke production runtime
        run: |
          umask 077
          bun scripts/generate-keys.ts > "$RUNNER_TEMP/image.env"
          printf '%s\n' \
            'DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/image_smoke' \
            'PORT=3000' 'WHOLESALER_LIVE=fixture' >> "$RUNNER_TEMP/image.env"
          trap 'docker logs gate-smoke; docker rm -f gate-smoke; rm -f "$RUNNER_TEMP/image.env"' EXIT
          docker run --detach --name gate-smoke --network host --env-file "$RUNNER_TEMP/image.env" "gate-image:$SHA"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:3000/api/health
          docker exec gate-smoke /usr/local/bin/bun -e '
            if (process.getuid() !== 1000) throw new Error("Expected runtime UID 1000");
            for (const path of ["/bin/sh", "/bin/bash", "/sbin/apk", "/usr/bin/apt", "/usr/bin/apt-get"]) {
              if (await Bun.file(path).exists()) throw new Error(`Unexpected runtime tool: ${path}`);
            }
          '
      - name: Smoke chat runtime
        run: |
          set -euo pipefail
          trap 'docker logs gate-chat-smoke; docker rm -f gate-chat-smoke' EXIT
          docker run --detach --name gate-chat-smoke -p 127.0.0.1:38090:8080 \
            -e WEBUI_AUTH=False -e WEBUI_SECRET_KEY=smoke-only-secret \
            -e ENABLE_OLLAMA_API=False -e ENABLE_OPENAI_API=False \
            -e OFFLINE_MODE=True -e DO_NOT_TRACK=True -e SCARF_NO_ANALYTICS=True \
            -e VALIO_AIMO_RECIPE_PERMISSION=False "gate-chat-image:$SHA"
          curl --fail --silent --show-error --retry 120 --retry-all-errors --retry-delay 2 --max-time 2 http://127.0.0.1:38090/health
          docker exec gate-chat-smoke python -c '
          import json, sys
          from pathlib import Path
          root = Path("/opt/trusted-trade/hosts/openwebui")
          sys.path.insert(0, str(root / "scripts"))
          import provision_agent, provision_buyer, provision_mcp
          assert provision_agent.FILES == root
          assert provision_agent.BASE == "http://127.0.0.1:8080"
          for persona in ("restaurant", "bakery"):
              assert provision_agent.system_prompt(persona)
          json.loads((root / "agent/purchase-scenarios.json").read_text())
          for path in (
              root / "agent/restaurant.png", root / "agent/bakery.png", root / "agent/chef.png",
              root / "scripts/migrate_auth.py", root / "scripts/tools/recipe_planner.py",
              root / "scripts/tools/valio_recipes.py",
              Path("/app/backend/open_webui/static/custom.css"),
              Path("/app/backend/open_webui/static/acme/kitchen.jpg"),
              Path("/app/backend/open_webui/static/acme/bakery.webp"),
              Path("/app/backend/open_webui/static/acme/credits.html"),
          ):
              assert path.is_file() and path.stat().st_size, path
          '
      - name: Publish verified images
        id: publish
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          repository=jaahuo/junction-2026-trusted-trade-agents
          tag="$SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          chat_tag="$tag-chat"
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          token=$(curl --fail --silent --show-error --user "$REGISTRY_USER:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repository:pull" | jq -er .token)
          publish_image() {
            local source=$1 tag=$2 field=$3 output=$4 identity=$5 image digest pushed expected pinned status attempt
            image="ghcr.io/$repository:$tag"
            docker tag "$source" "$image"
            docker push "$image"
            for attempt in 1 2 3 4 5 6; do
              status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --write-out '%{http_code}' -D "$RUNNER_TEMP/manifest-headers" -o "$RUNNER_TEMP/manifest.json" \
                -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/$repository/manifests/$tag")
              if [ "$status" = 200 ]; then break; fi
              if [ "$status" != 404 ] || [ "$attempt" = 6 ]; then
                echo "Manifest verification for $image failed with HTTP $status" >&2
                exit 1
              fi
              echo "Manifest for $image is not visible yet; checking again in 2 seconds." >&2
              sleep 2
            done
            digest=$(awk 'BEGIN { IGNORECASE=1 } tolower($1) == "docker-content-digest:" { gsub("\r", "", $2); print $2 }' "$RUNNER_TEMP/manifest-headers")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [ "sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d ' ' -f 1)" = "$digest" ]
            pushed=$(jq -er '.config.digest' "$RUNNER_TEMP/manifest.json")
            expected=$(jq -er --arg field "$field" '.[$field]' "$RUNNER_TEMP/deployment-evidence/manifest.json")
            [ "$pushed" = "$expected" ] || { echo "Pushed config digest $pushed does not match evidence $expected" >&2; exit 1; }
            pinned="ghcr.io/$repository@$digest"
            printf '%s=%s\n' "$output" "$pinned" >> "$GITHUB_OUTPUT"
            printf '%s=%s\n' "$identity" "$pinned" >> "$RUNNER_TEMP/deployment-evidence/identity.txt"
          }
          publish_image "gate-image:$SHA" "$tag" imageId image image
          publish_image "gate-chat-image:$SHA" "$chat_tag" chatImageId chat_image chatImage
      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-evidence
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: [target, publish]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.target.outputs.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Deploy verified digest
        id: deploy
        env:
          DEPLOY_OUTPUTS: ${{ secrets.DEPLOY_OUTPUTS }}
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          VERDA_INFERENCE_KEY: ${{ secrets.VERDA_INFERENCE_KEY }}
          OPENWEBUI_SECRET_KEY: ${{ secrets.OPENWEBUI_SECRET_KEY }}
          OPENWEBUI_ADMIN_EMAIL: ${{ secrets.OPENWEBUI_ADMIN_EMAIL }}
          OPENWEBUI_ADMIN_PASSWORD: ${{ secrets.OPENWEBUI_ADMIN_PASSWORD }}
          VALIO_AIMO_RECIPE_PERMISSION: ${{ vars.VALIO_AIMO_RECIPE_PERMISSION || 'False' }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
          DEPLOY_CHAT_IMAGE: ${{ needs.publish.outputs.chat_image }}
          DEPLOY_REGISTRY_USER: ${{ github.actor }}
          DEPLOY_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_OUTPUTS" ] && [ -n "$DEPLOY_ENV" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "Deployment secrets and known hosts are required" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          if [ "$(gh api "repos/$REPO/commits/main" --jq .sha)" != "$SHA" ]; then
            echo "Skipped: main moved past $SHA." >> "$GITHUB_STEP_SUMMARY"
            echo 'status=skipped-main-moved' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun scripts/deploy.ts push
          echo 'status=healthy' >> "$GITHUB_OUTPUT"
      - name: Record deployment result
        if: always()
        env:
          RUN_ID: ${{ needs.target.outputs.run_id }}
          ATTEMPT: ${{ needs.target.outputs.attempt }}
          IMAGE: ${{ needs.publish.outputs.image }}
          CHAT_IMAGE: ${{ needs.publish.outputs.chat_image }}
          OUTCOME: ${{ steps.deploy.outcome }}
          STATUS: ${{ steps.deploy.outputs.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-result"
          printf 'sourceSha=%s\ngateRunId=%s\ngateRunAttempt=%s\nimage=%s\nchatImage=%s\nstepOutcome=%s\nstatus=%s\n' \
            "$SHA" "$RUN_ID" "$ATTEMPT" "$IMAGE" "$CHAT_IMAGE" "$OUTCOME" "${STATUS:-not-healthy}" > "$RUNNER_TEMP/deploy-result/result.txt"
      - name: Retain deployment result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-result
          retention-days: 90
          if-no-files-found: error
